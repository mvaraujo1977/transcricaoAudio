# Tema da interface. Tudo o que o tema resolve fica aqui, e não em CSS injetado:
# CSS contra as classes que o Streamlit gera quebra na próxima atualização.
#
# `base` fica de fora de propósito -- sem ele a tela segue o modo claro/escuro do
# navegador, e cada modo é desenhado à mão abaixo. O escuro NÃO é conversão do
# claro: pastel claro sobre fundo escuro ofusca, então lá o equivalente de pastel
# é superfície pouco mais clara que o fundo, e o acento sobe em vez de descer.
#
# A paleta é pastel na SUPERFÍCIE, nunca no texto. Um matiz só, o verde-azulado,
# em duas intensidades: sálvia dessaturada para fundo e selo, teal fechado para o
# acento. Razões de contraste medidas no navegador estão no README.

[theme]
font = "sans-serif"
headingFont = "sans-serif"
# Títulos com peso 600: destacam sem pedir um tamanho de fonte a mais.
headingFontWeights = 600
# Cantos discretos. "small" é o menor valor que ainda diferencia campo de fundo.
baseRadius = "small"
# Borda nos campos em vez de fundo cinza: separa o campo do resto sem sombra.
# A cor da borda vem de borderColor, abaixo, porque a padrão do Streamlit fica em
# 1,45:1 contra o fundo -- longe dos 3:1 que um limite de widget precisa.
showWidgetBorder = true

[theme.light]
# Creme levemente quente no lugar do branco puro: é o que dá a temperatura.
backgroundColor = "#FAF8F4"
# Sálvia pastel nas superfícies (campos, uploader, expander, área de texto).
secondaryBackgroundColor = "#E7EFEA"
# Texto quase preto com um fio de verde, para casar sem perder legibilidade.
textColor = "#1C2723"
# Teal fechado: é a versão escura do mesmo pastel, e precisa ser profundo porque
# o Streamlit escreve em BRANCO sobre ele no botão primário -- aqui dá 5,47:1.
primaryColor = "#0F766E"
linkColor = "#0F766E"
# Sálvia: o par que pinta os selos e os números dos passos. O texto (grayText)
# é escuro, porque texto não pode ser pastel; o pastel fica no fundo do selo
# (grayBackground). Sem grayBackgroundColor o Streamlit derivaria o fundo desta
# cor a 10%, que sai quase branco e perde o verde.
grayColor = "#3F5B53"
grayTextColor = "#2E443D"
grayBackgroundColor = "#DCE8E1"
borderColor = "#77877F"

[theme.dark]
# Quase preto esverdeado, e a superfície só um degrau acima -- no escuro é assim
# que "pastel" se traduz: pouco contraste entre fundo e cartão, nada de tom claro.
backgroundColor = "#101715"
secondaryBackgroundColor = "#1B2523"
textColor = "#E6EDEA"
# Mais aberto que o acento do modo claro (luminância 0,17 contra 0,15), e ainda
# assim profundo o bastante para o branco do botão passar: 4,69:1. Subir mais o
# tom quebraria isso -- o Streamlit escreve em branco no botão nos DOIS modos.
primaryColor = "#178273"
# Link não é botão: aqui o teal pode abrir de vez, e ganha contraste no escuro.
linkColor = "#7FD8C6"
# Sálvia clara: mesmo papel do par do modo claro, invertido -- o "pastel" aqui é
# a superfície um degrau acima do fundo, e o texto é que fica claro.
grayColor = "#A9C4BB"
grayTextColor = "#BFD6CD"
grayBackgroundColor = "#26332F"
borderColor = "#5B7871"

[client]
# Esvazia o menu (Rerun, Clear cache, Deploy): sem nenhuma entrada sobrando, o
# Streamlit não desenha a barra do topo -- some o hambúrguer e o botão Deploy sem
# precisar de CSS. O que resta do cabeçalho é um elemento vazio, transparente e
# com pointer-events: none, que não ocupa espaço nem intercepta clique.
toolbarMode = "minimal"

[server]
# Quanto tempo a sessão sobrevive sem websocket. O padrão do Streamlit é 120 s,
# pensado para "pequenas quedas de rede" (o comentário é do próprio
# MemorySessionStorage) -- curto demais aqui.
#
# Perder o websocket já custa a transcrição em andamento: o servidor chama
# `request_script_stop()` na sessão que desconecta, e não há opção que mude isso.
# O que este valor decide é se, ao voltar, a pessoa reencontra a sessão dela com
# os minutos já transcritos, ou uma tela vazia. Com 120 s, trocar de app no
# celular e voltar um pouco depois apagava tudo sem explicação.
#
# 10 min, não mais: uma sessão guardada segura também o arquivo que ela enviou
# (até 100 MB na demo), então esticar isso é memória parada no servidor.
disconnectedSessionTTL = 600

# `websocketPingInterval` fica de fora de propósito. Ele serviria contra proxy
# que derruba socket ocioso, mas o Streamlit iguala o TIMEOUT do ping ao
# intervalo: um valor baixo passaria a derrubar a conexão sozinho se o laço de
# eventos engasgar durante a transcrição -- exatamente o que queremos evitar.
# Só vale mexer se a queda for observada de fato.

[browser]
# Mesma telemetria desligada que o Dockerfile passa por flag, para valer também
# quando a aplicação roda fora do container.
gatherUsageStats = false
