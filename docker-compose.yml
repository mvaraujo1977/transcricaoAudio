services:
  transcricao:
    # O nome da imagem e FIXO aqui, e nao derivado do nome da pasta.
    #
    # Sem esta linha o Compose monta o nome a partir do diretorio do projeto
    # (`<pasta>-transcricao`). Numa instalacao de cliente, onde a pasta pode se
    # chamar qualquer coisa, o nome nao bateria com o da imagem carregada do
    # .tar: o Compose nao a encontraria e tentaria CONSTRUIR -- justamente o que
    # o .tar existe para evitar, e que falha numa maquina sem internet.
    image: transcricao-audio:1.0
    build: .
    container_name: transcricao
    ports:
      # 127.0.0.1 publica a porta so no loopback. Sem o prefixo, o Docker escuta
      # em todas as interfaces e qualquer um na mesma rede (wifi de cafe, de
      # hotel) abre a aplicacao, que nao tem autenticacao nenhuma.
      - "127.0.0.1:8501:8501"
    volumes:
      # Arquivos largados em ./dados ficam visíveis para a CLI dentro do container.
      - ./dados:/app/dados
    restart: unless-stopped
